<div class="container">

<h1>ÜRETİM PANELİ</h1>

<div class="cards">

<div class="kart"><h2>Kalite Kontrol</h2><p>Kontrol bekleyenler</p></div>
<div class="kart"><h2>Hazır Ürün</h2><p>Sevkiyata hazır</p></div>
</div>

</div>

</html>
