<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raporlar</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111;
    color:white;
    font-family:Arial, sans-serif;
}

.header{
    background:black;
    padding:20px;
    border-bottom:3px solid gold;
    text-align:center;
}

.header h1{
    color:gold;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:30px;
}

.top{
    margin-bottom:25px;
}

.top a{
    color:gold;
    text-decoration:none;
    font-weight:bold;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
    margin-bottom:40px;
}

.kart{
    background:#1e1e1e;
    border:2px solid gold;
    border-radius:20px;
    padding:30px;
    text-align:center;
}

.kart h2{
    color:gold;
    margin-bottom:15px;
}

.kart p{
    font-size:32px;
    font-weight:bold;
}

.btnlar{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
    justify-content:center;
}

.btn{
    background:gold;
    color:black;
    text-decoration:none;
    padding:15px 30px;
    border-radius:12px;
    font-weight:bold;
    transition:0.3s;
}

.btn:hover{
    background:#ffcc00;
}

</style>

</head>

<body>

<div class="header">
<h1>RAPORLAR</h1>
</div>

<div class="container">

<div class="top">
<a href="/">← Ana Sayfa</a>
</div>

<div class="cards">

<div class="kart">
<h2>Toplam Ürün</h2>
<p>{{ toplam_urun }}</p>
</div>

<div class="kart">
<h2>Toplam Stok</h2>
<p>{{ toplam_stok }}</p>
</div>

<div class="kart">
<h2>Kritik Ürün</h2>
<p>{{ kritik }}</p>
</div>

</div>

<div class="btnlar">

<a class="btn" href="/excel_indir">
Excel İndir
</a>

<a class="btn" href="/pdf_rapor">
PDF İndir
</a>

</div>

</div>

</body>
</html>
