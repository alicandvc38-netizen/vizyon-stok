<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sevkiyat Paneli</title>
    <style>
        body { margin:0; font-family:Arial; background:#111; color:white; }
        .container { width:90%; margin:30px auto; }
        h1 { text-align:center; color:#ffc400; }
        a { color:#ffc400; text-decoration:none; font-weight:bold; }
        .card { background:#1c1c1c; border:2px solid #ffc400; border-radius:15px; padding:20px; margin-bottom:25px; }
        input, select { width:100%; padding:12px; margin:8px 0; border-radius:8px; border:none; box-sizing:border-box; }
        button { background:#ffc400; color:#111; padding:12px 20px; border:none; border-radius:10px; font-weight:bold; cursor:pointer; }
        .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:15px; }
        table { width:100%; border-collapse:collapse; background:#1c1c1c; margin-top:15px; }
        th, td { padding:12px; border-bottom:1px solid #444; text-align:center; }
        th { background:#ffc400; color:#111; }
        @media(max-width:900px){ .grid{grid-template-columns:1fr;} }
    </style>
</head>
<body>

<div class="container">

    <h1>SEVKİYAT PANELİ</h1>
    <a href="/">⬅ Ana Sayfa</a>

    <div class="card">
        <h2>Yeni Sevkiyat</h2>

        <form method="POST">
            <div class="grid">
                <input type="text" name="musteri" placeholder="Müşteri Adı" required>
                <input type="text" name="telefon" placeholder="Telefon">
                <input type="text" name="arac" placeholder="Araç">
                <input type="text" name="sofor" placeholder="Şoför">
            </div>

            <input type="text" name="adres" placeholder="Adres">

            <div class="grid">
                <select name="durum">
                    <option>Hazırlanıyor</option>
                    <option>Yolda</option>
                    <option>Teslim Edildi</option>
                </select>

                <input type="date" name="tarih" required>
            </div>

            <button type="submit">Sevkiyat Kaydet</button>
        </form>
    </div>

    <div class="card">
        <h2>Sevkiyat Listesi</h2>

        <table>
            <thead>
                <tr>
                    <th>Tarih</th>
                    <th>Müşteri</th>
                    <th>Telefon</th>
                    <th>Araç</th>
                    <th>Şoför</th>
                    <th>Durum</th>
                </tr>
            </thead>
            <tbody>
                {% for s in sevkiyatlar %}
                <tr>
                    <td>{{ s.tarih }}</td>
                    <td>{{ s.musteri }}</td>
                    <td>{{ s.telefon }}</td>
                    <td>{{ s.arac }}</td>
                    <td>{{ s.sofor }}</td>
                    <td>{{ s.durum }}</td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="6">Henüz sevkiyat kaydı yok</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

</div>

</body>
</html>
