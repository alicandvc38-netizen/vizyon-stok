<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stok Durumu</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111;
    color:white;
    font-family:Arial, sans-serif;
}

.header{
    background:black;
    padding:20px;
    border-bottom:3px solid gold;
    text-align:center;
}

.header h1{
    color:gold;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:30px;
}

.top{
    margin-bottom:25px;
}

.top a{
    color:gold;
    text-decoration:none;
    font-weight:bold;
}

.liste{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:25px;
}

.kart{
    background:#1e1e1e;
    border:2px solid gold;
    border-radius:20px;
    padding:20px;
}

.kart h2{
    color:gold;
    margin-bottom:15px;
}

.kart p{
    margin-bottom:10px;
}

.kritik{
    border:2px solid red;
}

.badge{
    display:inline-block;
    padding:8px 14px;
    border-radius:10px;
    margin-top:10px;
    font-weight:bold;
}

.normal{
    background:#00a651;
}

.danger{
    background:#d62828;
}

img{
    width:100%;
    height:220px;
    object-fit:cover;
    border-radius:12px;
    margin-top:15px;
}

</style>

</head>

<body>

<div class="header">
<h1>STOK DURUMU</h1>
</div>

<div class="container">

<div class="top">
<a href="/">← Ana Sayfa</a>
</div>

<div class="liste">

{% for u in urunler %}

<div class="kart {% if u['stok'] <= u['kritik_stok'] %}kritik{% endif %}">

<h2>{{ u['urun_adi'] }}</h2>

<p><b>Stok:</b> {{ u['stok'] }}</p>

<p><b>Kritik Seviye:</b> {{ u['kritik_stok'] }}</p>

{% if u['stok'] <= u['kritik_stok'] %}

<span class="badge danger">
Kritik Stok
</span>

{% else %}

<span class="badge normal">
Stok Normal
</span>

{% endif %}

{% if u['foto'] %}

<img src="/static/uploads/{{ u['foto'] }}">

{% endif %}

</div>

{% endfor %}

</div>

</div>

</body>
</html>
