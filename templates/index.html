<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vizyon Stok</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#111;
    color:white;
}

.header{
    background:black;
    padding:20px;
    text-align:center;
    border-bottom:3px solid gold;
}

.header h1{
    color:gold;
    margin:0;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:40px 20px;
}

.menu{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}

.kart{
    background:#1e1e1e;
    border:2px solid gold;
    border-radius:20px;
    padding:40px;
    text-align:center;
    transition:0.3s;
}

.kart:hover{
    transform:scale(1.03);
    background:#2b2b2b;
}

.kart a{
    color:white;
    text-decoration:none;
    font-size:24px;
    font-weight:bold;
}

.alt{
    text-align:center;
    margin-top:40px;
}

.cikis{
    background:gold;
    color:black;
    padding:15px 30px;
    border-radius:10px;
    text-decoration:none;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="header">
    <h1>VİZYON STOK TAKİP SİSTEMİ</h1>
</div>

<div class="container">

<div class="menu">

<div class="kart">
<a href="/urunler">Ürünler</a>
</div>

<div class="kart">
<a href="/satis">Satış</a>
</div>

<div class="kart">
<a href="/stok">Stok</a>
</div>

<div class="kart">
<a href="/raporlar">Raporlar</a>
</div>

<div class="kart">
<a href="/uretim">Üretim</a>
</div>

<div class="kart">
<a href="/sevkiyat">Sevkiyat</a>
</div>

</div>

<div class="alt">
<a class="cikis" href="/logout">Çıkış Yap</a>
</div>

</div>

</body>
</html>
