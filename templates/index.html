<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Vizyon Stok</title>

<style>

body{
    background:#111;
    color:white;
    font-family:Arial;
    margin:0;
    padding:40px;
}

h1{
    color:gold;
    text-align:center;
    margin-bottom:40px;
}

.menu{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
    max-width:700px;
    margin:auto;
}

.kart{
    background:#1e1e1e;
    padding:40px;
    border-radius:15px;
    text-align:center;
    border:2px solid gold;
    transition:0.3s;
}

.kart:hover{
    transform:scale(1.03);
    background:#2a2a2a;
}

a{
    text-decoration:none;
    color:white;
    font-size:22px;
    font-weight:bold;
}

</style>

</head>

<body>

<h1>VİZYON STOK TAKİP SİSTEMİ</h1>

<div class="menu">

<div class="kart">
<a href="/urunler">Ürünler</a>
</div>

<div class="kart">
<a href="/satis">Satış</a>
</div>

<div class="kart">
<a href="/stok">Stok</a>
</div>

<div class="kart">
<a href="/raporlar">Raporlar</a>
</div>

<div class="kart">
<a href="/uretim">Üretim</a>
</div>

<div class="kart">
<a href="/sevkiyat">Sevkiyat</a>
</div>

</div>

</body>
</html>
