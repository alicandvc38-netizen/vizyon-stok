<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vizyon Stok</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#0f0f0f;
    color:white;
}

.header{
    width:100%;
    background:black;
    padding:25px;
    border-bottom:3px solid gold;
    text-align:center;
}

.header h1{
    color:gold;
    font-size:36px;
}

.header p{
    margin-top:10px;
    color:#bbb;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:40px 20px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}

.card{
    background:#1b1b1b;
    border:2px solid gold;
    border-radius:20px;
    padding:40px;
    text-align:center;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
    background:#242424;
}

.card a{
    color:white;
    text-decoration:none;
    font-size:24px;
    font-weight:bold;
}

.footer{
    margin-top:50px;
    text-align:center;
}

.logout{
    display:inline-block;
    padding:15px 30px;
    background:gold;
    color:black;
    text-decoration:none;
    border-radius:12px;
    font-weight:bold;
}

.stats{
    margin-top:50px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.stat-box{
    background:#1b1b1b;
    border-left:5px solid gold;
    padding:25px;
    border-radius:15px;
}

.stat-box h2{
    color:gold;
    margin-bottom:10px;
}

.stat-box p{
    font-size:28px;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="header">
    <h1>VİZYON STOK</h1>
    <p>Profesyonel Stok ve Depo Yönetim Sistemi</p>
</div>

<div class="container">

<div class="cards">

<div class="card">
<a href="/urunler">Ürünler</a>
</div>

<div class="card">
<a href="/satis">Satış</a>
</div>

<div class="card">
<a href="/stok">Stok</a>
</div>

<div class="card">
<a href="/raporlar">Raporlar</a>
</div>

<div class="card">
<a href="/uretim">Üretim</a>
</div>

<div class="card">
<a href="/sevkiyat">Sevkiyat</a>
</div>

<div class="card">
<a href="/cari">Cari Hesap</a>
</div>

</div>

<div class="stats">

<div class="stat-box">
<h2>Toplam Ürün</h2>
<p>{{ toplam_urun }}</p>
</div>

<div class="stat-box">
<h2>Toplam Stok</h2>
<p>{{ toplam_stok }}</p>
</div>

<div class="stat-box">
<h2>Kritik Ürün</h2>
<p>{{ kritik }}</p>
</div>

</div>

<div class="footer">
<a class="logout" href="/logout">Çıkış Yap</a>
</div>

</div>

</body>
</html>
