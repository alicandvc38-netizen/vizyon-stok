<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Satış - Vizyon Stok</title>
    <style>
        body { margin:0; font-family:Arial; background:#111; color:white; }
        .container { width:90%; margin:30px auto; }
        h1 { text-align:center; color:#ffc400; }
        a { color:#ffc400; text-decoration:none; font-weight:bold; }
        .card { background:#1c1c1c; border:2px solid #ffc400; border-radius:15px; padding:20px; margin-bottom:25px; }
        input, select { width:100%; padding:12px; margin:8px 0; border-radius:8px; border:none; box-sizing:border-box; }
        button { background:#ffc400; color:#111; padding:12px 20px; border:none; border-radius:10px; font-weight:bold; cursor:pointer; }
        .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:15px; }
        table { width:100%; border-collapse:collapse; background:#1c1c1c; margin-top:15px; }
        th, td { padding:12px; border-bottom:1px solid #444; text-align:center; }
        th { background:#ffc400; color:#111; }
        @media(max-width:900px){ .grid{grid-template-columns:1fr;} }
    </style>
</head>
<body>

<div class="container">

    <h1>SATIŞ PANELİ</h1>
    <a href="/">⬅ Ana Sayfa</a>

    <div class="card">
        <h2>Yeni Satış</h2>

        <form method="POST">
            <div class="grid">
                <input type="text" name="musteri" placeholder="Müşteri Adı" required>

                <select name="urun_id" required>
                    <option value="">Ürün Seç</option>
                    {% for urun in urunler %}
                    <option value="{{ urun.id }}">{{ urun.ad }} - Stok: {{ urun.stok }}</option>
                    {% endfor %}
                </select>

                <input type="number" name="adet" placeholder="Satış Adedi" required>
                <input type="number" step="0.01" name="fiyat" placeholder="Birim Fiyat ₺" required>
            </div>

            <button type="submit">Satış Yap</button>
        </form>
    </div>

    <div class="card">
        <h2>Satış Geçmişi</h2>

        <table>
            <thead>
                <tr>
                    <th>Tarih</th>
                    <th>Müşteri</th>
                    <th>Ürün</th>
                    <th>Adet</th>
                    <th>Birim Fiyat</th>
                    <th>Toplam</th>
                </tr>
            </thead>
            <tbody>
                {% for s in satislar %}
                <tr>
                    <td>{{ s.tarih }}</td>
                    <td>{{ s.musteri }}</td>
                    <td>{{ s.urun_ad }}</td>
                    <td>{{ s.adet }}</td>
                    <td>{{ s.fiyat }} ₺</td>
                    <td>{{ s.toplam }} ₺</td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="6">Henüz satış yapılmadı</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

</div>

</body>
</html>
