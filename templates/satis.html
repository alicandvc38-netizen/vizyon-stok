<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Satış</title>
<style>
body{margin:0;font-family:Arial;background:#111;color:white;padding:30px}
h1{text-align:center;color:gold}
a{color:gold;text-decoration:none;font-weight:bold}
.form,.liste{max-width:850px;margin:25px auto;background:#1e1e1e;border:2px solid gold;border-radius:15px;padding:25px}
input,select,button{width:100%;padding:13px;margin:10px 0;border-radius:10px;border:none}
button{background:gold;color:black;font-weight:bold;cursor:pointer}
.kart{background:#292929;border:1px solid gold;border-radius:12px;padding:15px;margin:12px 0}
</style>
</head>
<body>

<a href="/">← Ana Sayfa</a>
<h1>SATIŞ PANELİ</h1>

<div class="form">
<form method="POST" action="/satis_ekle">
<select name="urun_id" required>
<option value="">Ürün Seç</option>
{% for u in urunler %}
<option value="{{ u['id'] }}">{{ u['urun_adi'] }} - Stok: {{ u['stok'] }}</option>
{% endfor %}
</select>

<input type="number" name="adet" placeholder="Adet" required>
<input type="number" step="0.01" name="fiyat" placeholder="Toplam Tutar" required>
<input type="text" name="musteri" placeholder="Müşteri Adı" required>

<button type="submit">Satış Yap</button>
</form>
</div>

<div class="liste">
<h2>Satış Geçmişi</h2>

{% for s in satislar %}
<div class="kart">
<p><b>Müşteri:</b> {{ s['musteri'] }}</p>
<p><b>Ürün:</b> {{ s['urun_adi'] }}</p>
<p><b>Adet:</b> {{ s['adet'] }}</p>
<p><b>Tutar:</b> {{ s['tutar'] }} TL</p>
</div>
{% endfor %}

</div>

</body>
</html>
