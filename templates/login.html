<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Giriş - Vizyon Stok</title>

    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            background: #1c1c1c;
            border: 2px solid #ffc400;
            border-radius: 18px;
            padding: 35px;
            width: 360px;
            text-align: center;
            box-shadow: 0 0 25px rgba(255, 196, 0, 0.25);
        }

        h1 {
            color: #ffc400;
            margin-bottom: 5px;
        }

        p {
            color: #ccc;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
        }

        button {
            width: 100%;
            background: #ffc400;
            color: #111;
            border: none;
            padding: 13px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
            margin-top: 10px;
        }

        button:hover {
            background: #e0aa00;
        }

        .hata {
            color: #ff4d4d;
            background: rgba(255, 77, 77, 0.1);
            border: 1px solid #ff4d4d;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .info {
            margin-top: 20px;
            font-size: 13px;
            color: #888;
        }
    </style>
</head>

<body>

<div class="login-box">
    <h1>Vizyon Stok</h1>
    <p>Yönetici Girişi</p>

    {% if hata %}
    <div class="hata">{{ hata }}</div>
    {% endif %}

    <form method="POST">
        <input type="text" name="kullanici" placeholder="Kullanıcı Adı" required>
        <input type="password" name="sifre" placeholder="Şifre" required>
        <button type="submit">Giriş Yap</button>
    </form>

    <div class="info">
        ABS Mobilya Stok Takip Sistemi
    </div>
</div>

</body>
</html>
